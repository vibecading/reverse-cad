<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reverse-cad studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #e9edf1; --panel: #f7f9fb; --ink: #15202b; --muted: #5b6875; --rule: #cdd5dd;
    --D: #e0218a; --I: #4f8cff; --A: #c99400; --P: #2f7d4f; --hot: #ffd400;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); overflow: hidden;
         font: 14px/1.4 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100vh; }

  aside { background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 16px 18px 10px; font-size: 15px; } .brand b { font-weight: 700; }
  .brand span { color: var(--muted); }
  .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px 10px; }
  .cases button { text-align: left; border: 1px solid var(--rule); background: #fff; border-radius: 4px; padding: 7px 9px;
                  font: inherit; font-weight: 500; color: var(--ink); cursor: pointer; }
  .cases button small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .cases button[aria-pressed=true] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .views { display: flex; gap: 0; margin: 0 14px 10px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .views button { flex: 1; border: 0; background: #fff; font: inherit; font-weight: 500; padding: 7px 0; cursor: pointer; color: var(--ink); }
  .views button + button { border-left: 1px solid var(--ink); }
  .views button[aria-pressed=true] { background: var(--ink); color: #fff; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px 10px; color: var(--muted); font-size: 13px; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .opts input[type=range] { width: 90px; }
  .params { overflow-y: auto; padding: 4px 16px 12px; border-top: 1px solid var(--rule); flex: 1; min-height: 0; }
  .params h2 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); font-weight: 500; }
  .param { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; align-items: center; padding: 4px 6px; margin: 0 -6px; border-radius: 4px; }
  .param.hot { background: #fff6c2; }
  .badge { width: 18px; height: 18px; border-radius: 3px; color: #fff; font-size: 11px; font-weight: 700;
           display: inline-flex; align-items: center; justify-content: center; }
  .param .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .param .val { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 13px; }
  .param .val.moved { color: #b86b00; }
  .param input { grid-column: 2 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
  .param input:disabled { opacity: .35; }
  .reset { margin: 10px 16px 14px; padding: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff;
           border-radius: 4px; font: inherit; font-weight: 500; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--I); outline-offset: 2px; }

  .stage { position: relative; min-width: 0; overflow: hidden; }
  .frame { position: absolute; border-radius: 4px; overflow: hidden;
           background: radial-gradient(120% 90% at 50% 20%, #f4f6f8 0%, #dde3e9 100%); box-shadow: 0 0 0 1px var(--rule); }
  .frame > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #photo { object-fit: fill; opacity: 0; transition: opacity .5s; }
  #plan, #graph { background: #fbfcfd; }
  .info { position: absolute; top: 16px; right: 16px; width: 330px; background: rgba(255,255,255,.93); border: 1px solid var(--rule);
          border-radius: 6px; padding: 12px 14px; font-size: 13px; box-shadow: 0 4px 18px rgba(21,32,43,.08); }
  .info h1 { font-size: 17px; margin: 0; } .info .by { color: var(--muted); margin: 0 0 8px; }
  .info table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .info td { padding: 2px 0; border-bottom: 1px solid #edf0f3; } .info td:last-child { text-align: right; white-space: nowrap; padding-left: 8px; }
  .info .sec { margin: 10px 0 4px; font-weight: 700; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .fit { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
  .fit b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .fit span { color: var(--muted); }
  .grades { display: flex; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .ref { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: rgba(21,32,43,.55); opacity: 0; transition: opacity .45s; pointer-events: none; }
  .ref.on { opacity: 1; }
  .ref img { max-width: 62%; max-height: 72%; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.35); background: #fff; padding: 8px; }
  .ref p { color: #fff; margin: 12px 0 0; font-size: 15px; }
  .info button { font: inherit; font-size: 12px; padding: 4px 9px; border: 1px solid var(--ink); background: #fff; border-radius: 4px; cursor: pointer; }
  .info .acts { display: flex; gap: 8px; margin-top: 12px; }
  .info .acts button { font-size: 13px; padding: 7px 12px; }
  .info .acts .ok { background: var(--ink); color: #fff; }
  .conflict { margin-top: 10px; padding: 8px 10px; border-left: 3px solid #c0392b; background: #fdeeee; font-size: 13px; }
  .info { max-height: calc(100vh - 32px); overflow-y: auto; }
  .legend { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 14px; font-size: 12px; color: var(--muted);
            background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>

<body>
<div class="app">
  <aside>
    <div class="brand"><b>reverse-cad</b> <span>studio</span></div>
    <div class="cases" id="cases"></div>
    <div class="views" id="views">
      <button data-v="3d">3D</button><button data-v="plan">Plan</button><button data-v="graph">Graph</button><button data-v="photo">Photo</button><button data-v="review">Review</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="oSpin"> turn</label>
      <label><input type="checkbox" id="oTruth"> drawings</label>
      <label><input type="checkbox" id="oMarks" checked> marks</label>
      <label>clay <input type="range" id="oClay" min="0" max="100" value="35"></label>
    </div>
    <div class="params" id="params"></div>
    <button class="reset" id="reset">Back to the current version</button>
  </aside>
  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <img id="photo" alt="">
      <canvas id="gl"></canvas>
      <canvas id="ov"></canvas>
      <svg id="plan" hidden></svg>
      <svg id="graph" hidden></svg>
    </div>
    <div class="legend" id="legend">
      <span><i style="background:var(--D)"></i>measured from the photo</span>
      <span><i style="background:var(--I)"></i>by a rule</span>
      <span><i style="background:var(--A)"></i>assumed</span>
      <span><i style="background:var(--P)"></i>drawings</span>
    </div>
    <div class="info" id="info"></div>
    <div class="ref" id="ref"><img id="refimg" alt=""><p id="refcap"></p></div>
  </main>
</div>
<script>const DATA = /*DATA*/null;</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const GC = { D: '#e0218a', I: '#4f8cff', A: '#c99400', P: '#2f7d4f' };

// ---------- parametric models: elements are boxes and gables whose coordinates are formulas over P
const box = (id, b, g, m = 'clay') => ({ id, t: 'box', b, g, m });
const gable = (id, b, g, m = 'roof') => ({ id, t: 'gable', b, g, m });   // b: x0,x1 (eaves), y0,y1 (ridge), ze, zr
const dim = (a, b, off) => ({ a, b, off });

const MODELS = {
  farnsworth: {
    design: { n: { init: 3, min: 2, max: 6, step: 1, g: 'I' }, t_len: { init: 16.8, min: 0, max: 24, step: 0.1, g: 'A' },
              carport: { init: 0, min: 0, max: 1, step: 1, g: 'A' } },
    cut: 3.0,
    handles(P) {
      const n = Math.round(P.n), L = 2 * P.c + n * P.s;
      return [{ k: 's', at: [L, P.W / 2], dir: [1, 0], per: 1 / n, label: 'bays' }, { k: 'W', at: [L / 2, P.W], dir: [0, 1], per: 1, label: 'width' },
              { k: 'g_x', at: [P.g_x, P.W / 2], dir: [1, 0], per: 1, label: 'glass wall' }];
    },
    proposals: [
      { name: 'Set the glass back 0.45 m', by: 'agent', note: 'deeper shade on the south porch', changes: { g_y: 0.45 } },
      { name: 'Bays to 6.90 m', by: 'M. Sokolova, architect', note: 'room for a second bedroom', changes: { s: 6.9 } },
      { name: 'Carport instead of the terrace', by: 'client meeting', note: '', changes: { t_len: 0, carport: 1 } },
    ],
    build(P) {
      const n = Math.round(P.n), L = 2 * P.c + n * P.s, col = 0.2, E = [];
      E.push(box('floor slab', [0, L, 0, P.W, P.zf_b, P.zf_t], 'D'));
      E.push(box('roof slab', [0, L, 0, P.W, P.zr_b, P.zr_t], 'D'));
      for (let i = 0; i <= n; i++) {
        const x = P.c + i * P.s, g = i < 2 ? 'D' : 'I';
        E.push(box('column S' + i, [x - col / 2, x + col / 2, -col, 0, 0, P.zr_t - 0.03], g, 'steel'));
        E.push(box('column N' + i, [x - col / 2, x + col / 2, P.W, P.W + col, 0, P.zr_t - 0.03], g, 'steel'));
      }
      E.push(box('glass', [P.g_x, L - P.g_y, P.g_y, P.W - P.g_y, P.zf_t, P.zr_b], 'D', 'glass'));
      if (P.t_len > 0.05) E.push(box('terrace', [P.x_te - P.t_len, P.x_te, P.y_tf, P.y_tn, P.h_t - P.d_t, P.h_t], 'A'));
      if (P.carport > 0.5) E.push(box('carport', [L + 3, L + 9, 0, 6, 0, 2.7], 'A'));
      return E;
    },
    dims(P) {
      const n = Math.round(P.n), L = 2 * P.c + n * P.s, D = [dim([0, 0], [P.c, 0], 1.6)];
      for (let i = 0; i < n; i++) D.push(dim([P.c + i * P.s, 0], [P.c + (i + 1) * P.s, 0], 1.6));
      D.push(dim([L - P.c, 0], [L, 0], 1.6), dim([0, 0], [L, 0], 3.2), dim([0, P.W], [0, 0], 1.6));
      return D;
    },
    metrics(P) {
      const n = Math.round(P.n), L = 2 * P.c + n * P.s;
      return [['length, 2c + n·s', L, 'm'], ['width', P.W, 'm'], ['bays', n, ''],
              ['floor above grade', P.zf_t, 'm'], ['floor to ceiling', P.zr_b - P.zf_t, 'm'],
              ['glass enclosure', (L - P.g_x - P.g_y) * (P.W - 2 * P.g_y), 'm²']];
    },
  },
  crownhall: {
    design: { n: { init: 3, min: 2, max: 6, step: 1, g: 'I' } },
    cut: 3.0,
    handles: P => [{ k: 's', at: [Math.round(P.n) * P.s + 2 * P.b, 6 * P.b], dir: [1, 0], per: 1 / Math.round(P.n), label: 'span' }],
    proposals: [{ name: 'Four girder bays', by: 'agent', note: 'a larger studio hall', changes: { n: 4 } }],
    build(P) {
      const n = Math.round(P.n), cant = 2 * P.b, D = 12 * P.b, x0 = -cant, x1 = n * P.s + cant, gw = 0.5, E = [];
      E.push(box('podium', [x0, x1, 0, D, 0, P.z_mb], 'A'));
      E.push(box('glass', [x0, x1, 0, D, P.z_mb, P.zr_b], 'I', 'glass'));
      E.push(box('roof', [x0, x1, 0, D, P.zr_b, P.zr_t], 'D'));
      E.push(box('transom', [x0, x1, -0.08, 0, P.z_tt - 0.06, P.z_tt + 0.06], 'D', 'steel'));
      for (let k = 0; k <= n; k++) {
        const x = k * P.s, g = k < 3 ? 'D' : 'I';
        E.push(box('girder ' + k, [x - gw / 2, x + gw / 2, -P.d_c, D + P.d_c, P.zr_t, P.zg], g, 'steel'));
        E.push(box('column S' + k, [x - P.wc / 2, x + P.wc / 2, -P.d_c, -P.d_c + P.wc, 0, P.zg], g, 'steel'));
        E.push(box('column N' + k, [x - P.wc / 2, x + P.wc / 2, D + P.d_c - P.wc, D + P.d_c, 0, P.zg], 'I', 'steel'));
      }
      const m = Math.round((x1 - x0) / P.b);
      for (let i = 0; i <= m; i++) {
        const x = x0 + i * P.b;
        E.push(box('mullion ' + i, [x - 0.05, x + 0.05, -0.12, 0, P.z_mb, P.zr_b], 'D', 'steel'));
      }
      return E;
    },
    dims(P) {
      const n = Math.round(P.n), cant = 2 * P.b, D = 12 * P.b, out = [dim([-cant, 0], [0, 0], 2.4)];
      for (let k = 0; k < n; k++) out.push(dim([k * P.s, 0], [(k + 1) * P.s, 0], 2.4));
      out.push(dim([n * P.s, 0], [n * P.s + cant, 0], 2.4), dim([-cant, 0], [n * P.s + cant, 0], 4.6), dim([-cant, D], [-cant, 0], 2.4));
      return out;
    },
    metrics(P) {
      const n = Math.round(P.n), cant = 2 * P.b, L = n * P.s + 2 * cant, D = 12 * P.b;
      return [['length, n·s + 4b', L, 'm'], ['depth, 12b', D, 'm'], ['clear span', P.s, 'm'],
              ['girder depth', P.zg - P.zr_t, 'm'], ['ceiling', P.zr_b, 'm'], ['main floor', L * D, 'm²']];
    },
  },
  robie: {
    design: { fascia: { init: 0.25, min: 0.1, max: 0.6, step: 0.01, g: 'A' } },
    cut: 1.2,
    handles: P => [{ k: 'Ls', at: [P.Ls, P.Lw / 2], dir: [1, 0], per: 1, label: 'enclosure' },
                   { k: 'ryn', at: [P.rx + 12, P.ryn], dir: [0, 1], per: 1, label: 'roof' }],
    proposals: [],
    build(P) {
      return [
        box('stone base', [0, P.Ls, 0, P.Lw, 0, P.h_b], 'D', 'stone'),
        box('brick wall', [0, P.Ls, 0, P.Lw, P.h_b, P.h_cb], 'D', 'brick'),
        box('coping', [-0.06, P.Ls + 0.06, -0.06, P.Lw + 0.06, P.h_cb, P.h_ct], 'D', 'stone'),
        box('living floor', [P.rx + 1.5, P.rx + 23.5, P.rys + 1.4, P.ryn - 1.4, P.h_ct, P.rzt - P.fascia], 'A', 'brick'),
        box('roof', [P.rx, P.rx + 25, P.rys, P.ryn, P.rzt - P.fascia, P.rzt], 'D', 'roof'),
      ];
    },
    dims: P => [dim([0, 0], [P.Ls, 0], 1.4), dim([0, P.Lw], [0, 0], 1.4), dim([P.rx, P.rys], [P.rx, P.ryn], -1.4)],
    metrics: P => [['enclosure', P.Ls * P.Lw, 'm²'], ['coping', P.h_ct, 'm'], ['brick', P.h_cb - P.h_b, 'm'],
                   ['roof, north to south', P.ryn - P.rys, 'm'], ['roof edge, west', P.rx, 'm']],
  },
  gamble: {
    design: { D: { init: 9.0, min: 5, max: 14, step: 0.1, g: 'A' } },
    cut: 1.5,
    handles: P => [{ k: 'ov', at: [P.Ww + P.ov, P.D / 2], dir: [1, 0], per: 1, label: 'overhang' },
                   { k: 'D', at: [P.Ww / 2, P.D + 0.6], dir: [0, 1], per: 1, label: 'depth' }],
    proposals: [],
    build(P) {
      return [
        box('plinth', [-0.12, P.Ww + 0.12, -0.12, P.D, -0.6, 0], 'A', 'stone'),
        box('walls', [0, P.Ww, 0, P.D, 0, P.zve], 'D'),
        gable('roof', [-P.ov, P.Ww + P.ov, -P.dv, P.D + 0.6, P.zve, P.zap], 'D'),
        box('upper windows', [P.w2x0, P.w2x1, -0.08, 0, P.w2b, P.w2t], 'D', 'window'),
        box('lower windows', [P.w1x0, P.w1x1, -0.08, 0, P.w1b, P.w1t], 'D', 'window'),
      ];
    },
    dims: P => [dim([0, -P.dv], [P.Ww, -P.dv], 2.0), dim([-P.ov, -P.dv], [0, -P.dv], 1.0), dim([P.Ww, -P.dv], [P.Ww + P.ov, -P.dv], 1.0),
                dim([-P.ov, P.D + 0.6], [-P.ov, -P.dv], 1.2)],
    metrics: P => [['wing width', P.Ww, 'm'], ['ridge', P.zap, 'm'],
                   ['roof pitch', Math.atan2(P.zap - P.zve, P.Ww / 2 + P.ov) * 180 / Math.PI, '°'],
                   ['gable overhang', P.ov, 'm'], ['verge in front of the wall', P.dv, 'm']],
  },
};

// ---------- state
let cur, P, P0, view = '3d', hot = null, deps = {}, photoSize = [1920, 1280];
let main, hist = [], props = [], rev = null, planTf = null, planDrag = null;  // versions, proposals, the one under review
let pose = null, flight = null, grow = 0, spin = false, orbit = { az: -0.95, el: 0.38, dist: 40, target: new THREE.Vector3() };

// ---------- three.js
const glc = $('gl'), ovc = $('ov'), octx = ovc.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, 1.5, 0.1, 3000);
cam.matrixAutoUpdate = true;
const hemi = new THREE.HemisphereLight(0xffffff, 0xc9c2b6, 1.35); hemi.position.set(0, 0, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.17 }));
ground.receiveShadow = true; scene.add(ground);
let model = new THREE.Group(); scene.add(model);

const MAT = {
  clay: 0xe9e5dd, stone: 0xdcd6ca, brick: 0xd8c5b8, roof: 0xb8b2a9, steel: 0x8e959c,
  glass: 0xa8c8d8, window: 0x5e6b75,
};
function material(m) {
  const glass = m === 'glass';
  return new THREE.MeshStandardMaterial({ color: MAT[m] || MAT.clay, roughness: glass ? 0.2 : 0.92, metalness: 0,
    transparent: true, opacity: glass ? 0.32 : 1, depthWrite: !glass, emissive: 0x000000 });
}

function gableGeometry(w, l, h) {
  // cross-section in x (width w), extruded along y (length l), from z = 0 to the ridge h; origin at bottom centre
  const a = [-w / 2, -l / 2, 0], b = [w / 2, -l / 2, 0], c = [0, -l / 2, h], a2 = [-w / 2, l / 2, 0], b2 = [w / 2, l / 2, 0], c2 = [0, l / 2, h];
  const tri = [a, b, c, a2, c2, b2, a, c, c2, a, c2, a2, b, b2, c2, b, c2, c, a, a2, b2, a, b2, b];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tri.flat(), 3));
  g.computeVertexNormals();
  return g;
}

function edgesOf(e) {
  const [x0, x1, y0, y1, z0, z1] = e.b;
  if (e.t === 'gable') {
    const xm = (x0 + x1) / 2, A = [x0, y0, z0], B = [x1, y0, z0], C = [xm, y0, z1], A2 = [x0, y1, z0], B2 = [x1, y1, z0], C2 = [xm, y1, z1];
    return [[A, B], [B, B2], [B2, A2], [A2, A], [C, C2], [A, C], [B, C], [A2, C2], [B2, C2]];
  }
  const V = [];
  for (const z of [z0, z1]) V.push([x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]);
  return [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]].map(([i, j]) => [V[i], V[j]]);
}

function rebuild(animate) {
  scene.remove(model);
  model.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  model = new THREE.Group();
  const E = MODELS[cur.model].build(P);
  const zs = E.map(e => e.b[4]).sort((a, b) => a - b);
  for (const e of E) {
    const [x0, x1, y0, y1, z0, z1] = e.b;

  const t = new Set([...theirs.moved, ...theirs.removed]);
  const since = hist.slice(rev.prop.base).map(h => h.name).join(', ');
  return [...ours.moved, ...ours.removed].filter(id => t.has(id)).map(id => ({ id, since }));
}
function reviewPanel() {
  const vers = hist.map((h, i) => `<tr><td><b>v${i + 1}</b> ${h.name}</td><td>${h.by}${i === hist.length - 1 ? ' · <b>current</b>' : ''}</td></tr>`).reverse().join('');
  const open = props.map((pr, i) => pr.status === 'open'
    ? `<tr><td>${pr.name}<br><small style="color:var(--muted)">${pr.by}${pr.note ? ' · ' + pr.note : ''}</small></td><td><button class="rv" data-i="${i}">${rev && rev.i === i ? 'Reviewing' : 'Review'}</button></td></tr>` : '').join('');
  let body = '';
  if (rev) {
    const d = elemDiff(main, P), pr = rev.prop, label = k => cur.labels[k] || k;
    const params = Object.keys(P).filter(k => Math.abs(P[k] - main[k]) > 1e-9)
      .map(k => `<tr><td>${label(k)}</td><td>${fmt(main[k])} → <b>${fmt(P[k])}</b></td></tr>`).join('');
    const why = id => { const ks = Object.keys(P).filter(k => Math.abs(P[k] - main[k]) > 1e-9 && deps[k] && deps[k].has(id)); return ks.length ? ' <small style="color:var(--muted)">by ' + ks.map(label).join(', ') + '</small>' : ''; };
    const groupList = (ids, c) => [...new Set(ids.map(groupOf))].map(g => { const n = ids.filter(id => groupOf(id) === g).length;
      return `<tr><td><span class="dot" style="background:${c}"></span>${g}${n > 1 ? ' ×' + n : ''}${why(ids.find(id => groupOf(id) === g))}</td><td></td></tr>`; }).join('');
    const c0 = checkState(main), c1 = checkState(P);
    const flips = Object.keys(c1).filter(k => c0[k] !== c1[k]).map(k => `<tr><td><span class="dot" style="background:${c1[k] ? '#2f7d4f' : '#c0392b'}"></span>${label(k)}</td><td>${c1[k] ? 'now within 5 %' : 'now off the drawings'}</td></tr>`).join('');
    const cf = conflicts();
    body = `<div class="sec">Proposal: ${pr.name}</div><p class="by" style="margin:0 0 6px">${pr.by}, drawn on v${pr.base}</p>
      <table>${params}</table>
      <div class="sec">Elements</div><table>${groupList(d.moved, '#f0aa14')}${groupList(d.added, '#28aa46')}${groupList(d.removed, '#dc3232')}</table>
      ${flips ? `<div class="sec">Checks against the drawings</div><table>${flips}</table>` : ''}
      ${cf.length ? `<div class="conflict"><b>Design conflict.</b> ${[...new Set(cf.map(c => groupOf(c.id)))].join(', ')} also changed in ${cf[0].since}. Nobody has seen the two together yet: check the combination in 3D before accepting.</div>` : ''}
      <div class="acts"><button class="ok" id="accept">${cf.length ? 'Accept the combination' : 'Accept into the model'}</button><button id="reject">Reject</button></div>`;
  }
  $('info').innerHTML = `<h1>${cur.title}</h1><p class="by">model history</p><table>${vers}</table>
    ${open ? `<div class="sec">Open proposals</div><table>${open}</table>` : `<p class="by" style="margin-top:8px">No open proposals. Move a slider to propose a change.</p>`}${body}`;
  $('info').querySelectorAll('.rv').forEach(b => b.addEventListener('click', () => openProposal(+b.dataset.i)));
  if (rev) { $('accept').addEventListener('click', accept); $('reject').addEventListener('click', reject); }
}
function openProposal(i) {
  rev = { i, prop: props[i] };
  if (view !== 'review') setView('review');
  P = { ...main, ...props[i].changes }; buildParams(); computeDeps(); rebuild(false); info();
}
function accept() {
  hist.push({ name: rev.prop.name, by: rev.prop.by, P: { ...P } }); rev.prop.status = 'accepted';
  main = { ...P }; rev = null; rebuild(false); info();
}
function reject() {
  rev.prop.status = 'rejected'; rev = null; P = { ...main }; buildParams(); computeDeps(); rebuild(false); info();
}
function paintReview() {
  if (view !== 'review') return;
  const d = elemDiff(main, P), col = { moved: 0xf0aa14, added: 0x28aa46 };
  const st = {}; for (const k of ['moved', 'added']) for (const id of d[k]) st[id] = k;
  model.children.forEach(m => {
    const s = st[m.userData.id];
    if (s) { m.material.color.setHex(col[s]); m.material.opacity = 1; }
    else { m.material.opacity = m.material.depthWrite === false ? 0.15 : 0.45; }
  });
  for (const e of MODELS[cur.model].build(main)) {
    if (!d.removed.includes(e.id)) continue;
    const [x0, x1, y0, y1, z0, z1] = e.b, geo = new THREE.BoxGeometry(Math.max(x1 - x0, 1e-3), Math.max(y1 - y0, 1e-3), Math.max(z1 - z0, 1e-3));
    geo.translate(0, 0, (z1 - z0) / 2);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xdc3232, transparent: true, opacity: 0.55, roughness: 0.9 }));
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, z0); m.userData = { id: e.id, delay: -1, ghost: true };
    model.add(m);
  }
}

// ---------- layout, views, cases
function layout() {
  const st = $('stage'), a = photoSize[0] / photoSize[1];
  const side = st.clientWidth > 1100 ? 362 : 0;  // the info panel keeps its own column on wide screens
  const W = st.clientWidth - side - 40, H = st.clientHeight - 40;
  let fw = W, fh = W / a; if (fh > H) { fh = H; fw = H * a; }
  Object.assign($('frame').style, { width: fw + 'px', height: fh + 'px', left: 20 + (W - fw) / 2 + 'px', top: (st.clientHeight - fh) / 2 + 'px' });
  renderer.setSize(fw, fh, false);
  const dpr = Math.min(2, window.devicePixelRatio || 1); ovc.width = fw * dpr; ovc.height = fh * dpr;
  refreshView();
}
function setView(v, ms = 1600) {
  const was = view; view = v;
  if (was === 'review' && v !== 'review') { rev = null; P = { ...main }; buildParams(); computeDeps(); }
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  $('legend').hidden = v !== 'photo';
  if (v === 'photo') {
    fly(photoPose(), was === 'photo' ? 0 : ms, () => { $('photo').style.opacity = 1; applyClay(); });
  } else {
    $('photo').style.opacity = 0;
    if (was === 'photo') fly(orbitPose(), ms);
    applyClay();
  }
  rebuild(false); info();
  refreshView();
}
function select(i) {
  cur = DATA[i]; hot = null;
  const design = MODELS[cur.model].design;
  P0 = { ...Object.fromEntries(Object.entries(design).map(([k, d]) => [k, d.init])), ...cur.params };
  P = { ...P0 }; main = { ...P0 }; rev = null;
  hist = [{ name: 'Solved from ' + (cur.photos === 1 ? 'one photo' : cur.photos + ' photos'), by: 'solver', P: { ...P0 } }];
  props = (MODELS[cur.model].proposals || []).map(p => ({ ...p, base: 1, status: 'open' }));
  document.querySelectorAll('#cases button').forEach((b, j) => b.setAttribute('aria-pressed', i === j));
  $('photo').style.opacity = 0;
  $('photo').onload = () => { photoSize = [$('photo').naturalWidth, $('photo').naturalHeight]; layout(); if (view === 'photo') applyPose(pose = photoPose()); };
  $('photo').src = cur.photo; $('refimg').src = cur.photo;
  $('refcap').textContent = 'Reference: ' + cur.source.split(',').slice(0, 2).join(',');
  rebuild(true); frameModel(); computeDeps(); buildParams(); info();
  pose = view === 'photo' ? photoPose() : orbitPose(); applyPose(pose); flight = null;
  if (view === 'photo') $('photo').style.opacity = 1;
  applyClay(); refreshView();
}
function reference(ms) {
  $('ref').classList.add('on');
  return new Promise(r => setTimeout(() => { $('ref').classList.remove('on'); r(); }, ms));
}

// ---------- interaction
let drag = null;
glc.addEventListener('pointerdown', e => { if (view !== '3d' && view !== 'review') return; drag = [e.clientX, e.clientY]; glc.setPointerCapture(e.pointerId); });
glc.addEventListener('pointermove', e => {
  if (!drag) return;
  orbit.az -= (e.clientX - drag[0]) * 0.006; orbit.el = Math.min(1.45, Math.max(0.05, orbit.el + (e.clientY - drag[1]) * 0.005));
  drag = [e.clientX, e.clientY];
});
glc.addEventListener('pointerup', () => { drag = null; });
glc.addEventListener('wheel', e => { if (view === '3d' || view === 'review') { orbit.dist *= Math.exp(e.deltaY * 0.001); e.preventDefault(); } }, { passive: false });
DATA.forEach((c, i) => {
  const b = document.createElement('button'); b.innerHTML = `${c.title}<small>${c.by}</small>`;
  b.addEventListener('click', () => select(i)); $('cases').appendChild(b);
});
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
$('reset').addEventListener('click', () => { P = { ...main }; buildParams(); rebuild(false); computeDeps(); info(); refreshView(); });
$('oSpin').addEventListener('input', () => { spin = $('oSpin').checked; });
$('oClay').addEventListener('input', applyClay);
['oTruth', 'oMarks'].forEach(id => $(id).addEventListener('input', () => {}));
window.addEventListener('resize', layout);

// ---------- loop
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);  // first, so one bad frame cannot stop the loop
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (spin && (view === '3d' || view === 'review') && !drag) orbit.az += dt * 0.12;
  if (flight) {
    const t = flight.ms ? Math.min(1, (now - flight.t0) / flight.ms) : 1, e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const f = flight.from, to = flight.to;
    pose = { pos: f.pos.clone().lerp(to.pos, e), quat: f.quat.clone().slerp(to.quat, e), fr: f.fr.map((v, i) => v + (to.fr[i] - v) * e) };
    if (t >= 1) { const d = flight.done; flight = null; pose = to; if (d) d(); }
  } else if (view !== 'photo') pose = orbitPose();
  applyPose(pose);
  if (grow) {
    let all = true;
    for (const m of model.children) {
      const s = Math.min(1, Math.max(0.001, (now - grow - m.userData.delay) / 450));
      m.scale.z = 1 - Math.pow(1 - s, 3); if (s < 1) all = false;
    }
    if (all) grow = 0;
  }
  renderer.render(scene, cam);
  drawOverlay();
}

// an API for scripted walkthroughs (media/record_studio.py)
window.studio = {
  select, view: setView, reference, hot: setHot,
  spin: on => { spin = on; $('oSpin').checked = on; },
  truth: on => { $('oTruth').checked = on; },
  set(k, v) { P[k] = v; const inp = document.querySelector(`input[aria-label="${k}"]`); if (inp) inp.value = v; changed(k); },
  get: k => P[k],
  animate(k, to, ms) {  // move a parameter smoothly, as a hand on the slider would
    const from = P[k], t0 = performance.now(), step = MODELS[cur.model].design[k]?.step === 1;
    return new Promise(done => {
      const go = now => {
        const t = Math.min(1, (now - t0) / ms), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        let v = from + (to - from) * e; if (step) v = Math.round(v);
        if (v !== P[k]) this.set(k, v);
        if (t < 1) requestAnimationFrame(go); else done();
      };
      requestAnimationFrame(go);
    });
  },
  reset: () => $('reset').click(),
  review: i => openProposal(i), accept: () => accept(), reject: () => reject(),
  orbit,
};

select(0); setView('3d', 0); layout();
requestAnimationFrame(tick);
</script>
</body>
